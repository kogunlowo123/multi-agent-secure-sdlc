apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Container Images
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images must be signed with cosign before deployment.
      This prevents supply chain attacks from unsigned or tampered images.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - secure-sdlc-*
      verifyImages:
        - imageReferences:
            - "ghcr.io/kogunlowo123/multi-agent-secure-sdlc/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/kogunlowo123/multi-agent-secure-sdlc/.github/workflows/release.yml@refs/tags/*"
                    issuer: "https://token.actions.githubusercontent.com"
