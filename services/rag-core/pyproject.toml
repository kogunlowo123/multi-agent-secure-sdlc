[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-sdlc-rag-core"
version = "0.1.0"
description = "Multi-Agent Secure SDLC RAG Core Service"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "opensearch-py>=2.5.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.43",
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
