name: Security Finding
description: Report a security vulnerability found by an agent or manual review
title: "[Security]: "
labels: ["security", "finding"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
        - INFORMATIONAL
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: OWASP Category
      options:
        - "A01:2021-Broken Access Control"
        - "A02:2021-Cryptographic Failures"
        - "A03:2021-Injection"
        - "A04:2021-Insecure Design"
        - "A05:2021-Security Misconfiguration"
        - "A06:2021-Vulnerable and Outdated Components"
        - "A07:2021-Identification and Authentication Failures"
        - "A08:2021-Software and Data Integrity Failures"
        - "A09:2021-Security Logging and Monitoring Failures"
        - "A10:2021-Server-Side Request Forgery"
        - "CWE (other)"
        - "Other"
    validations:
      required: true

  - type: input
    id: cwe-id
    attributes:
      label: CWE ID
      placeholder: "CWE-89"

  - type: textarea
    id: description
    attributes:
      label: Finding Description
      description: Detailed description of the vulnerability.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Code snippet, stack trace, or other evidence.
      render: text
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: Recommended Remediation
      description: How should this vulnerability be fixed?
    validations:
      required: true
