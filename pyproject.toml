[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-secure-sdlc"
version = "0.1.0"
description = "Enterprise AI platform for multi-agent secure software delivery"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "structlog>=24.1.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.40.0",
    "semgrep>=1.78.0",
    "gitpython>=3.1.43",
    "sentence-transformers>=3.0.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.30",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "services/api/src",
    "services/agent-runtime/src",
    "services/rag-core/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["infra/", "deploy/", ".venv/", "node_modules/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["infra/", "deploy/", "tests/"]
