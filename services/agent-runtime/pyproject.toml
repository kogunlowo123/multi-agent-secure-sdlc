[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-sdlc-agent-runtime"
version = "0.1.0"
description = "Multi-Agent Secure SDLC Agent Runtime"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "semgrep>=1.78.0",
    "gitpython>=3.1.43",
    "sentence-transformers>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.30",
    "opentelemetry-sdk>=1.25.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../../services/api/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
